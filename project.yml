# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen
# Sixty.xcodeproj is generated, so it isn't committed.
name: Sixty

options:
  bundleIdPrefix: uk.co.timbrazier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SixtyCore:
    path: SixtyCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Sixty:
    type: application
    platform: iOS
    sources:
      - path: Sixty
    dependencies:
      - package: SixtyCore
    info:
      path: Sixty/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sixty
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Sixty uses the camera to take your daily progress photo.
        UIAppFonts:
          - BarlowCondensed-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.timbrazier.sixty
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Pick your Personal Team under Signing & Capabilities, or set it here.
        DEVELOPMENT_TEAM: ""

schemes:
  Sixty:
    build:
      targets:
        Sixty: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SixtyCore/SixtyCoreTests
